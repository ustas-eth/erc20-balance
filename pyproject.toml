[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "erc20-balance"
dynamic = ["version"]
description = "Interactive ERC-20 and native balances with explicit RPC selection"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ustas-eth"}]
dependencies = []
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/ustas-eth/erc20-balance"
Issues = "https://github.com/ustas-eth/erc20-balance/issues"

[project.scripts]
erc20-balance = "erc20_balance.launcher:main"

[tool.hatch.version]
path = "src/erc20_balance/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/erc20_balance"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "scripts/", "docs/", ".githooks/", "pyproject.toml", "uv.lock", "README.md", "LICENSE", "CONTRIBUTING.md", "AGENTS.md"]

[dependency-groups]
dev = ["pexpect>=4.9,<5", "ruff>=0.12,<1"]
screenshots = ["pexpect>=4.9,<5", "pyte>=0.8,<1", "pillow>=10,<12"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
